<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" fill="none">
<style>
* { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.fill { transform-origin: left center; animation: fill 4s cubic-bezier(.65,0,.35,1) infinite; }
@keyframes fill { 0% { transform: scaleX(.05); } 45%, 100% { transform: scaleX(.62); } }
.drop { animation: drop 4s cubic-bezier(.3,1.4,.6,1) infinite; }
@keyframes drop { 0% { transform: translateY(-40px); opacity: 0; } 20% { opacity: 1; } 45%, 100% { transform: translateY(32px); opacity: 1; } }
.ok { animation: ok 4s infinite; }
@keyframes ok { 0%, 48% { transform: scale(0); } 58% { transform: scale(1.15); } 64%, 100% { transform: scale(1); } }
.shadow { animation: sh 4s infinite; }
@keyframes sh { 0% { opacity: .2; transform: scaleX(.5); } 45%, 100% { opacity: 1; transform: scaleX(1); } }

</style>
<rect width="880" height="220" rx="22" fill="#FAFAF9"/>

<rect x="120" y="60" width="300" height="100" rx="16" fill="#F2F0F4"/>
<rect x="144" y="84" width="252" height="16" rx="8" fill="#E9E5EC"/>
<rect class="fill" x="144" y="84" width="252" height="16" rx="8" fill="#7A688A"/>
<rect x="144" y="116" width="120" height="10" rx="5" fill="#D8D0DE"/>
<rect x="144" y="134" width="80" height="10" rx="5" fill="#D8D0DE"/>
<g class="drop">
  <path d="M600 52 l40 21 v42 l-40 21 l-40 -21 v-42 z" fill="#D99A6C"/>
  <path d="M600 52 l40 21 l-40 21 l-40 -21 z" fill="#E8B48D"/>
</g>
<g class="ok">
  <circle cx="680" cy="64" r="16" fill="#1B1C1E"/>
  <path d="M672 64 l6 6 l11 -12" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<rect x="540" y="172" width="120" height="8" rx="4" fill="#E4E1E7" class="shadow"/>

</svg>
