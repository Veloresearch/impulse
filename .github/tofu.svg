<svg xmlns="http://www.w3.org/2000/svg" width="880" height="182" viewBox="0 0 880 182" fill="none">
<style>
* { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.hop { animation: hop 3.2s cubic-bezier(.3,0,.3,1) infinite; transform-origin: 50% 100%; }
@keyframes hop { 0%, 60%, 100% { transform: translateY(0) scale(1,1); } 66% { transform: translateY(0) scale(1.06,.92); } 76% { transform: translateY(-18px) scale(.97,1.04); } 86% { transform: translateY(0) scale(1.05,.94); } 92% { transform: scale(1,1); } }
.eyes { animation: blink 4.6s infinite; transform-origin: 50% 45%; }
@keyframes blink { 0%, 44%, 50%, 100% { transform: scaleY(1); } 47% { transform: scaleY(.12); } }
.shadow { animation: shadow 3.2s cubic-bezier(.3,0,.3,1) infinite; }
@keyframes shadow { 0%, 66%, 86%, 100% { transform: scaleX(1); opacity: 1; } 76% { transform: scaleX(.7); opacity: .6; } }

</style>
